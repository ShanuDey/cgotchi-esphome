name: display-sim check

# Runs the control server's tests and validates the simulator's ESPHome config. It does not
# compile: the build is slow and the config check already catches a broken face header or YAML.

on:
  pull_request:
    paths:
      - display-sim/**
      - components/face/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/display-sim.yml
  push:
    branches: [main]
    paths:
      - display-sim/**
      - components/face/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/display-sim.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ESPHome's sdl display runs sdl2-config while validating the config.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Control server tests
        run: uv run pytest display-sim/tests -q

      - name: Simulator config
        run: uv run esphome config display-sim/display-sim.yaml
