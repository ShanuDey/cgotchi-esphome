# Display simulator: runs the real face component on a PC, no device needed. It opens a 240x296
# SDL window. Settings come from settings.txt (edit it while this runs), and from the keyboard
# while the window has focus (keys at the bottom of this file). See README.md. Only the face is
# simulated, not the other pages or hardware.
esphome:
  name: cgotchi-sim
host:

# Always the local components: the point is to try edits before pushing them.
external_components:
  - source:
      type: local
      path: ../components
    components: [display_ui, face]

display_ui:

logger:

display:
  - platform: sdl
    id: lcd
    dimensions:
      width: 240
      height: 296
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      // The device's renderer (display_ui/ui.h). Display Frame and WebView are not simulated.
      cgotchi::ui::State st;
      st.now_ms = millis();
      st.page = id(page_sel).active_index().value_or(0);
      st.expression = id(face_sel).active_index().value_or(0);
      st.voice = id(voice_sel).active_index().value_or(0);
      st.playing = id(speaking_sw).state;
      st.hour24 = id(clock_fmt_sel).active_index().value_or(0) == 1;
      st.time = id(sim_time).now();
      const std::string &fixed = id(clock_time).state;
      if (fixed.size() == 5) {
        st.time.hour = atoi(fixed.c_str());
        st.time.minute = atoi(fixed.c_str() + 3);
      }
      st.message_title = id(msg_title).state;
      st.message_body = id(msg_body).state;
      cgotchi::ui::render(it, cgotchi::ui::make_palette(id(bg_color), id(accent_color), id(secondary_color)),
                          {id(font_clock), id(font_med), id(font_small)}, st);

time:
  - platform: host
    id: sim_time
    on_time:
      - seconds: 0               # once a minute
        then:
          - component.update: lcd

font:
  - file: "gfonts://Roboto"
    id: font_clock
    size: 72
  - file: "gfonts://Roboto"
    id: font_med
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 20

select:
  - platform: template
    name: "Display Page"
    id: page_sel
    options: [Face, Clock, Message]   # first three of the device's, same order as cgotchi::ui::Page
    initial_option: Face
    optimistic: true
    on_value:
      - component.update: lcd
  - platform: template
    name: "Clock Format"
    id: clock_fmt_sel
    options: ["12 hour", "24 hour"]
    initial_option: "12 hour"
    optimistic: true
    on_value:
      - component.update: lcd
  - platform: template
    name: "Face Expression"
    id: face_sel
    options: [Happy, Sad, Sleepy, Surprised, Angry, Laughing, Confused, Love, Wink]   # same order as cgotchi::face::Expression
    initial_option: Happy
    optimistic: true
    on_value:
      - component.update: lcd
  - platform: template
    name: "Voice State"
    id: voice_sel
    options: [Idle, Listening, Thinking, Replying, Error]
    initial_option: Idle
    optimistic: true
    on_value:
      - component.update: lcd

switch:
  - platform: template
    name: "Speaking"
    id: speaking_sw
    optimistic: true
    on_turn_on:
      - component.update: lcd
    on_turn_off:
      - component.update: lcd

text:
  - platform: template
    name: "Message Title"
    id: msg_title
    mode: text
    max_length: 16            # as on the device
    optimistic: true
    initial_value: "Hello"
    on_value:
      - component.update: lcd
  - platform: template
    name: "Message Body"
    id: msg_body
    mode: text
    max_length: 120           # as on the device
    optimistic: true
    initial_value: "Set me from Home Assistant"
    on_value:
      - component.update: lcd
  - platform: template
    name: "Clock Time"        # simulator only: "HH:MM" freezes the clock, empty is the computer's time
    id: clock_time
    mode: text
    max_length: 5
    optimistic: true
    initial_value: ""
    on_value:
      - component.update: lcd

number:
  - platform: template
    name: "Face Frame Rate"
    id: face_fps
    min_value: 5
    max_value: 25
    step: 5
    unit_of_measurement: fps
    mode: slider
    optimistic: true
    initial_value: 20

output:
  - platform: template
    id: face_r
    type: float
    write_action: []
  - platform: template
    id: face_g
    type: float
    write_action: []
  - platform: template
    id: face_b
    type: float
    write_action: []
  - platform: template
    id: sec_r
    type: float
    write_action: []
  - platform: template
    id: sec_g
    type: float
    write_action: []
  - platform: template
    id: sec_b
    type: float
    write_action: []
  - platform: template
    id: bg_r
    type: float
    write_action: []
  - platform: template
    id: bg_g
    type: float
    write_action: []
  - platform: template
    id: bg_b
    type: float
    write_action: []

light:
  - platform: rgb
    name: "Accent Color"
    id: accent_color
    red: face_r
    green: face_g
    blue: face_b
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    initial_state:
      color_mode: rgb
      red: 0%
      green: 78%
      blue: 100%
    on_state:
      - component.update: lcd
  - platform: rgb
    name: "Secondary Color"
    id: secondary_color
    red: sec_r
    green: sec_g
    blue: sec_b
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    initial_state:
      color_mode: rgb
      red: 50%
      green: 90%
      blue: 100%
    on_state:
      - component.update: lcd
  - platform: rgb
    name: "Background Color"
    id: bg_color
    red: bg_r
    green: bg_g
    blue: bg_b
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    initial_state:
      color_mode: rgb
      red: 0%
      green: 0%
      blue: 0%
    on_state:
      - component.update: lcd

globals:
  - id: settings_text         # contents of settings.txt last applied, to spot a change
    type: std::string

interval:
  # Apply settings.txt (path in $DISPLAY_SIM_SETTINGS, set by run.sh) whenever its contents change.
  - interval: 200ms
    then:
      - lambda: |-
          const char *path = getenv("DISPLAY_SIM_SETTINGS");
          FILE *file = path ? fopen(path, "r") : nullptr;
          if (file == nullptr) return;
          char buf[1024];
          const size_t len = fread(buf, 1, sizeof(buf) - 1, file);
          fclose(file);
          const std::string text(buf, len);
          if (text == id(settings_text)) return;
          id(settings_text) = text;

          auto lower = [](std::string s) {
            for (auto &c : s) c = tolower((unsigned char) c);
            return s;
          };
          auto trim = [](std::string s) {
            const char *ws = " \t\r\n";
            s.erase(0, s.find_first_not_of(ws));
            s.erase(s.find_last_not_of(ws) + 1);
            return s;
          };
          auto pick = [&](select::Select *sel, const std::string &value) {
            for (const char *opt : sel->traits.get_options()) {
              if (lower(opt) == lower(value)) {
                sel->make_call().set_option(opt).perform();
                return;
              }
            }
            ESP_LOGW("settings", "'%s' is not an option of %s", value.c_str(), sel->get_name().c_str());
          };

          // "#rrggbb" sets a color light directly (like picking a color in HA).
          auto set_color = [&](light::LightState *l, const std::string &value) {
            if (value.size() != 7 || value[0] != '#' || value.find_first_not_of("0123456789abcdefABCDEF", 1) != std::string::npos) {
              ESP_LOGW("settings", "'%s' is not a color like #00c7ff", value.c_str());
              return;
            }
            // Like HA: the strongest channel becomes 100% and the brightness holds the rest; black is off.
            const long rgb = strtol(value.c_str() + 1, nullptr, 16);
            const float r = ((rgb >> 16) & 0xFF) / 255.0f, g = ((rgb >> 8) & 0xFF) / 255.0f, b = (rgb & 0xFF) / 255.0f;
            const float m = fmaxf(r, fmaxf(g, b));
            if (m == 0.0f) {
              auto off = l->turn_off();
              off.set_transition_length(0);
              off.perform();
              return;
            }
            auto call = l->turn_on();
            call.set_rgb(r / m, g / m, b / m);
            call.set_brightness(m);
            call.set_transition_length(0);
            call.perform();
          };

          size_t start = 0;
          while (start <= text.size()) {
            size_t end = text.find('\n', start);
            if (end == std::string::npos) end = text.size();
            std::string line = text.substr(start, end - start);
            start = end + 1;
            line = trim(line);
            if (line.empty() || line[0] == '#') continue;
            const size_t eq = line.find('=');
            if (eq == std::string::npos) {
              ESP_LOGW("settings", "ignored line without '=': %s", line.c_str());
              continue;
            }
            const std::string key = lower(trim(line.substr(0, eq)));
            std::string value = trim(line.substr(eq + 1));
            // A comment starts at "#" after a space or tab. A value may itself start with "#" (a color).
            // Message text is literal: a "#" in it is not a comment.
            const bool literal = key == "message_title" || key == "message_body";
            for (size_t i = 1; i < value.size() && !literal; i++) {
              if (value[i] == '#' && (value[i - 1] == ' ' || value[i - 1] == '\t')) { value.erase(i); break; }
            }
            value = trim(value);
            ESP_LOGI("settings", "%s = %s", key.c_str(), value.c_str());
            auto on_off = [&](switch_::Switch *sw) {
              const std::string v = lower(value);
              if (v == "on" || v == "true" || v == "1") sw->turn_on();
              else if (v == "off" || v == "false" || v == "0") sw->turn_off();
              else ESP_LOGW("settings", "%s must be on or off, not '%s'", key.c_str(), value.c_str());
            };
            if (key == "page") pick(id(page_sel), value);
            else if (key == "expression") pick(id(face_sel), value);
            else if (key == "voice") pick(id(voice_sel), value);
            else if (key == "accent") set_color(id(accent_color), value);
            else if (key == "secondary") set_color(id(secondary_color), value);
            else if (key == "background") set_color(id(bg_color), value);
            else if (key == "speaking") on_off(id(speaking_sw));
            else if (key == "clock_24h") id(clock_fmt_sel).make_call().set_option(lower(value) == "on" || lower(value) == "true" || value == "1" ? "24 hour" : "12 hour").perform();
            else if (key == "clock_time") id(clock_time).make_call().set_value(value).perform();
            else if (key == "message_title") id(msg_title).make_call().set_value(value.substr(0, 16)).perform();
            else if (key == "message_body") id(msg_body).make_call().set_value(value.substr(0, 120)).perform();
            else if (key == "fps") {
              char *endp = nullptr;
              const float fps = strtof(value.c_str(), &endp);
              if (endp == value.c_str()) ESP_LOGW("settings", "fps must be a number, not '%s'", value.c_str());
              else id(face_fps).make_call().set_value(fps).perform();
            } else {
              ESP_LOGW("settings", "unknown setting '%s'", key.c_str());
            }
          }
          id(lcd).update();
  - interval: 20ms            # same animation tick as the device
    then:
      - lambda: |-
          auto &face = cgotchi::face::instance();
          face.set_fps(id(face_fps).state);
          if (face.visible && face.needs_frame(millis())) id(lcd).update();
  - interval: 100ms           # frames for the boot animation
    then:
      - lambda: |-
          if (millis() < 2800) id(lcd).update();

# Keys (click the window first so it has focus):
#   Left / Right  previous / next expression      V  next voice state
#   S             toggle speaking
#   P             next page (Face, Clock, Message)
#   Up / Down     frame rate +5 / -5 fps
binary_sensor:
  - platform: sdl
    id: key_right
    key: SDLK_RIGHT
    on_press:
      - select.next: {id: face_sel, cycle: true}
  - platform: sdl
    id: key_left
    key: SDLK_LEFT
    on_press:
      - select.previous: {id: face_sel, cycle: true}
  - platform: sdl
    id: key_voice
    key: SDLK_v
    on_press:
      - select.next: {id: voice_sel, cycle: true}
  - platform: sdl
    id: key_speak
    key: SDLK_s
    on_press:
      - switch.toggle: speaking_sw
  - platform: sdl
    id: key_page
    key: SDLK_p
    on_press:
      - select.next: {id: page_sel, cycle: true}
  - platform: sdl
    id: key_fps_up
    key: SDLK_UP
    on_press:
      - number.increment: {id: face_fps, cycle: false}
  - platform: sdl
    id: key_fps_down
    key: SDLK_DOWN
    on_press:
      - number.decrement: {id: face_fps, cycle: false}
