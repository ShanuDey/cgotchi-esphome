[project]
name = "cgotchi-esphome"
version = "0.1.0"
description = "ESPHome firmware for the cgotchi board"
readme = "README.md"
authors = [
    { name = "Shanu Dey", email = "sd4shanudey@gmail.com" },
]
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "display-frame",
    "display-sim",
    "esphome==2026.10.0",
    "esptool>=5.4.0",
]

# display-frame and display-sim are workspace members so the editor and
# `uv sync --all-packages` see their dependencies; they are declared only in each
# member's own pyproject.toml.
[tool.uv.workspace]
members = ["display-frame", "display-sim"]

# Both members are in the default dev group so a plain `uv run <member>/<script>.py` works.
[tool.uv.sources]
display-frame = { workspace = true }
display-sim = { workspace = true }
